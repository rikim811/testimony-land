<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Testimony - Testimony Land</title>
  <link rel="stylesheet" href="/testimony/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <div id="branding">
        <img src="/assets/logo-500x200.png" alt="Testimony Land Logo">
      </div>
      <nav>
        <ul id="navLinks"></ul>
      </nav>
    </div>
  </header>

  <main class="testimony-container">
    <div class="testimony-header">
      <h1 class="testimony-title">Edit Your Testimony</h1>
    </div>

    <div class="testimony-content">
      <form id="editForm" class="edit-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="testimony">Your Testimony</label>
          <div id="editor-container">
            <div id="editor"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="tags">Tags (comma separated, max 3)</label>
          <input type="text" id="tags" 
                 placeholder="Type a tag and press comma to add another (max 3)"
                 aria-description="Enter up to 3 tags, separated by commas">
          <div id="tagsList" class="testimony-tags"></div>
          <small class="help-text">Example: faith, healing, prayer</small>
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="publishTestimony">
            <label for="publishTestimony">Publish testimony (make it visible to others)</label>
          </div>
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="privateTestimony">
            <label for="privateTestimony">Make testimony private (only accessible via link)</label>
          </div>
        </div>

        <div class="testimony-actions">
          <button type="button" class="action-button secondary-button" id="cancelButton">
            <i class="fas fa-times"></i> Cancel
          </button>
          <button type="submit" class="action-button primary-button" id="saveButton">
            <i class="fas fa-save"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="/firebase-init.js"></script>
  <script src="/testimony/edit/script.js"></script>
</body>
</html>
