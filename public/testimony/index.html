<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimony - Testimony Land</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="container">
      <div id="branding">
        <img src="../assets/logo-500x200.png" alt="Testimony Land Logo">
      </div>
      <nav>
        <ul id="navLinks"></ul>
      </nav>
    </div>
  </header>

  <main class="testimony-container">
    <div class="testimony-header">
      <h1 class="testimony-title" id="testimonyTitle"></h1>
      <div class="testimony-meta">
        <div class="author-info">
          <div class="author-avatar" id="authorAvatar"></div>
          <a href="#" class="author-name" id="authorName"></a>
        </div>
        <span class="last-edited" id="lastEdited"></span>
      </div>
    </div>

    <div class="testimony-content">
      <div class="testimony-text" id="testimonyText"></div>
      <div class="testimony-tags" id="testimonyTags"></div>
      <div class="testimony-actions">
        <div class="action-buttons" id="actionButtons">
          <!-- Action buttons will be added dynamically -->
        </div>
        <div class="share-buttons">
          <button class="action-button secondary-button" id="shareButton">
            <i class="fas fa-share"></i> Share
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="../firebase-init.js"></script>
  <script src="script.js"></script>
</body>
</html>
