<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Testimony Land</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="container">
      <div id="branding">
        <img src="../assets/logo-500x200.png" alt="Testimony Land Logo">
      </div>
      <nav>
        <ul id="navLinks"></ul>
      </nav>
    </div>
  </header>

  <main class="profile-container">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar"></div>
      <div class="profile-info">
        <h1 class="profile-name" id="profileName"></h1>
        <p class="profile-username" id="profileUsername"></p>
        <div class="profile-actions" id="profileActions">
          <!-- Actions will be added dynamically -->
        </div>
      </div>
    </div>

    <div id="profileContent">
      <!-- Profile content will be loaded here -->
    </div>

    <div id="editForm" class="edit-form" style="display: none;">
      <div class="form-group">
        <label for="editName">Name</label>
        <input type="text" id="editName" required>
      </div>

      <div class="form-group">
        <label for="editBio">Bio</label>
        <textarea id="editBio" placeholder="Tell us about yourself..."></textarea>
      </div>

      <div class="form-group">
        <label for="editAge">Age</label>
        <input type="number" id="editAge" min="13" max="120">
        <div class="checkbox-group">
          <input type="checkbox" id="editShowAge">
          <label for="editShowAge">Show Age</label>
        </div>
      </div>

      <div class="form-group">
        <label for="editGender">Gender</label>
        <select id="editGender">
          <option value="">Prefer not to say</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <div class="checkbox-group">
          <input type="checkbox" id="editShowGender">
          <label for="editShowGender">Show Gender</label>
        </div>
      </div>

      <div class="form-group">
        <label for="editDenomination">Denomination</label>
        <select id="editDenomination">
          <option value="">Select denomination...</option>
          <option value="Catholic">Catholic</option>
          <option value="Protestant">Protestant</option>
          <option value="Orthodox">Orthodox</option>
          <option value="Baptist">Baptist</option>
          <option value="Methodist">Methodist</option>
          <option value="Lutheran">Lutheran</option>
          <option value="Presbyterian">Presbyterian</option>
          <option value="Pentecostal">Pentecostal</option>
          <option value="Evangelical">Evangelical</option>
          <option value="Other">Other</option>
        </select>
        <div class="checkbox-group">
          <input type="checkbox" id="editShowDenomination">
          <label for="editShowDenomination">Show Denomination</label>
        </div>
      </div>

      <div class="form-group">
        <label for="editSocialMediaType">Social Media Platform</label>
        <select id="editSocialMediaType">
          <option value="">None</option>
          <option value="Instagram">Instagram</option>
          <option value="Twitter">Twitter</option>
          <option value="GitHub">GitHub</option>
          <option value="LinkedIn">LinkedIn</option>
          <option value="Facebook">Facebook</option>
          <option value="YouTube">YouTube</option>
          <option value="TikTok">TikTok</option>
        </select>
      </div>

      <div class="form-group">
        <label for="editSocialMedia">Social Media Username</label>
        <input type="text" id="editSocialMedia" placeholder="Your username">
      </div>

      <div class="form-group">
        <label>Privacy Settings</label>
        <div class="checkbox-group">
          <input type="checkbox" id="editPrivateProfile">
          <label for="editPrivateProfile">Private Profile</label>
        </div>
      </div>

      <div class="form-actions">
        <button class="cancel-button" id="cancelEdit">Cancel</button>
        <button class="save-button" id="saveProfile">Save Changes</button>
      </div>
    </div>
  </main>

  <div id="privateSection" class="private-section" style="display: none;">
    <h3 class="label">Private Profile</h3>
    <p class="content">This profile is private. Only you can see this information.</p>
  </div>

  <div class="info-card" style="display: none;">
    <label class="label">Bio</label>
    <div class="content">${userData.bio || 'No bio added yet'}</div>
  </div>

  <div class="info-card" style="display: none;">
    <label class="label">Age</label>
    <div class="content">${userData.age}</div>
  </div>

  <div class="info-card" style="display: none;">
    <label class="label">Gender</label>
    <div class="content">${userData.gender}</div>
  </div>

  <div class="info-card" style="display: none;">
    <label class="label">Denomination</label>
    <div class="content">${userData.denomination}</div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="../firebase-init.js"></script>
  <script src="script.js"></script>
</body>
</html>
